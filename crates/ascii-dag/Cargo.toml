[package]
edition = "2024"
rust-version = "1.92"
name = "ascii-dag"
version = "0.9.1"
authors = ["Ash"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Zero-dependency, no_std compatible ASCII DAG renderer. Visualize error chains, dependency trees, and graphs in the terminal."
readme = "README.md"
keywords = [
    "tree",
    "graph",
    "sugiyama",
    "terminal",
    "layout",
]
categories = [
    "data-structures",
    "visualization",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/AshutoshMahala/ascii-dag"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
alloc = []
arena = []
arena-idx-u16 = ["arena"]
arena-idx-u32 = ["arena"]
arena-idx-u8 = ["arena"]
default = [
    "std",
    "generic",
]
embedded_no_std = []
generic = ["alloc"]
serde = []
std = ["alloc"]
warnings = ["std"]

[lib]
name = "ascii_dag"
path = "src/lib.rs"

